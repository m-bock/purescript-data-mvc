package:
  name: data-mvc
  build:
    censorProjectWarnings:
      - WildcardInferredType
      - ImplicitQualifiedImport
      - HidingImport
  publish:
    version: 0.0.3
    license: BSD-3-Clause
    location:
      githubOwner: thought2
      githubRepo: purescript-data-mvc
  dependencies:
    - arrays: ">=7.2.1 <8.0.0"
    - bifunctors: ">=6.0.0 <7.0.0"
    - either: ">=6.1.0 <7.0.0"
    - heterogeneous: ">=0.6.0 <0.8.0"
    - maybe: ">=6.0.0 <7.0.0"
    - mvc: ">=0.0.1 <0.0.2"
    - newtype: ">=5.0.0 <6.0.0"
    - prelude: ">=6.0.1 <7.0.0"
    - profunctor: ">=6.0.0 <7.0.0"
    - record: ">=4.0.0 <5.0.0"
    - variant: ">=8.0.0 <9.0.0"
  test:
    main: Test.Main
    censorTestWarnings:
      - WildcardInferredType
      - ImplicitQualifiedImport
      - HidingImport
    dependencies:
      - aff: ">=7.1.0 <8.0.0"
      - effect: ">=4.0.0 <5.0.0"
      - identity: ">=6.0.0 <7.0.0"
      - spec: ">=7.3.0 <8.0.0"
      - spec-discovery: ">=8.0.1 <9.0.0"
      - strings: ">=6.0.1 <7.0.0"
      - typelevel-prelude: ">=7.0.0 <8.0.0"
workspace:
  buildOpts:
    censorLibraryWarnings: all
